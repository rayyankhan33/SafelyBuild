# NOT YET TESTED (Docker was unavailable on the development machine).
# Start: docker compose up --build   (set JWT_SECRET in your shell or an .env file first)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safelybuild
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safelybuild"]
      interval: 5s
      retries: 10
  inference:
    build: { context: services/inference }
    environment:
      MATERIAL_PROVIDER: none
    ports: ["8000:8000"]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/safelybuild
      INFERENCE_URL: http://inference:8000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      db: { condition: service_healthy }
      inference: { condition: service_started }
    volumes: [photos:/data]
    ports: ["4000:4000"]
volumes:
  pgdata:
  photos:
